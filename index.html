<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Now Playing — 영화</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="navbar__logo">MOVIE<span>FLIX</span></div>
    <nav class="navbar__nav">
      <a href="#" class="active">현재 상영작</a>
    </nav>
  </header>

  <section class="hero" id="hero">
    <div class="hero__overlay"></div>
    <div class="hero__content">
      <p class="hero__badge">NOW PLAYING</p>
      <h1 class="hero__title" id="hero-title">로딩 중...</h1>
      <p class="hero__meta" id="hero-meta"></p>
      <p class="hero__overview" id="hero-overview"></p>
    </div>
  </section>

  <main class="main">
    <section class="row">
      <h2 class="row__title">상영작 목록</h2>
      <div class="row__slider" id="movie-list">
        <div class="loading" id="loading">
          <div class="loading__spinner"></div>
          <p>영화를 불러오는 중...</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Powered by <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a></p>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
